<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم لغة الإشارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center bg-slate-950 text-white">

    <div class="hero w-full max-w-7xl rounded-3xl p-6 md:p-8 text-white mb-8 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-right">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold mb-2">🤟 مترجم لغة الإشارة العربية</h1>
            <p class="opacity-90 text-sm md:text-base">YOLOv26s · بناء تلقائي للكلمات · فيديو وصور · نطق وترجمة</p>
        </div>
        <div class="flex gap-2 font-semibold">
            <span id="statusBadge" class="bg-red-500/80 px-4 py-2 rounded-full backdrop-blur-sm text-sm">غير متصل ❌</span>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 w-full max-w-7xl">
        
        <!-- قسم الالتقاط -->
        <div class="card p-4 md:p-6 rounded-2xl flex flex-col gap-4 lg:col-span-7 bg-slate-900 border border-slate-800">
            <h2 class="text-xl font-bold">📸 التقاط الإشارة</h2>
            
            <div class="flex flex-wrap md:flex-nowrap gap-2 bg-slate-800/50 p-1 rounded-xl border border-slate-700">
                <button id="btnWebcam" class="flex-1 py-2 rounded-lg bg-[#7c5cff22] text-[#7c5cff] font-bold transition-all text-sm md:text-base">📷 كاميرا</button>
                <button id="btnVideo" class="flex-1 py-2 rounded-lg text-slate-400 hover:bg-slate-800 transition-all text-sm md:text-base">🎥 فيديو</button>
                <button id="btnImage" class="flex-1 py-2 rounded-lg text-slate-400 hover:bg-slate-800 transition-all text-sm md:text-base">🖼️ صورة</button>
            </div>
            
            <input type="file" id="fileInput" class="hidden">
            
            <div class="relative w-full rounded-xl overflow-hidden bg-black aspect-video border border-slate-700 flex items-center justify-center">
                <video id="videoElement" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
                <img id="imageElement" class="w-full h-full object-contain hidden">
                <canvas id="canvasElement" class="hidden"></canvas>
            </div>

            <div class="flex justify-between items-center p-3 rounded-lg bg-slate-800/50 border border-slate-700">
                <span class="text-slate-400 text-sm md:text-base">النتيجة الحالية:</span>
                <span id="liveResult" class="font-bold text-lg text-cyan-400">-</span>
            </div>
        </div>

        <!-- قسم الجملة المكونة -->
        <div class="card p-4 md:p-6 rounded-2xl flex flex-col gap-4 lg:col-span-5 bg-slate-900 border border-slate-800">
            <h2 class="text-xl font-bold">✍️ الجملة المُكوَّنة</h2>
            
            <!-- التعديل الجوهري لمنع خروج النص وتعديل التنسيق -->
            <div id="sentenceBox" class="sentence-box w-full min-h-[140px] max-h-[220px] p-4 rounded-xl border border-slate-700/60 bg-slate-950/80 text-2xl md:text-3xl font-bold leading-relaxed overflow-y-auto break-words whitespace-pre-wrap dir-rtl">
                <span class="opacity-40 text-lg font-normal">ابدأ بالإشارة...</span>
            </div>

            <div class="grid grid-cols-3 md:grid-cols-5 gap-2">
                <button id="btnSpace" class="btn p-2 rounded-xl text-xs md:text-sm font-bold bg-slate-800 hover:bg-slate-700">␣ مسافة</button>
                <button id="btnDel" class="btn p-2 rounded-xl text-xs md:text-sm font-bold bg-slate-800 hover:bg-slate-700">⌫ حذف</button>
                <button id="btnClear" class="btn p-2 rounded-xl text-xs md:text-sm font-bold bg-slate-800 hover:bg-slate-700 text-red-400">🗑️ مسح</button>
                <button id="btnAudioAr" class="btn p-2 rounded-xl text-xs md:text-sm font-bold bg-slate-800 hover:bg-slate-700">🔊 نطق</button>
                <button id="btnTranslate" class="btn btn-primary p-2 rounded-xl text-xs md:text-sm font-bold md:col-span-1 col-span-3 bg-purple-600 hover:bg-purple-500">🌐 ترجم</button>
            </div>

            <div class="mt-4 flex flex-col gap-3">
                <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-3">
                    <label class="text-sm text-slate-400">لغة الترجمة:</label>
                    <select id="targetLang" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm outline-none flex-1">
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                    </select>
                </div>
                
                <div id="translationResultBox" class="hidden p-4 rounded-xl border border-slate-700 bg-slate-800/50 flex flex-col gap-2">
                    <p id="translationText" class="text-lg font-bold text-left dir-ltr text-white break-words"></p>
                    <button id="btnAudioTrans" class="self-end text-sm text-cyan-400 hover:text-cyan-300">🔊 نطق الترجمة</button>
                </div>
            </div>
        </div>

    </div>

    <audio id="audioPlayer" class="hidden"></audio>

    <script src="app.js"></script>
</body>
</html>
